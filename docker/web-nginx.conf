server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Single-page app: unknown paths are routes, not missing files. /r/{id}
    # share links have to reach the app rather than a 404 from nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames change whenever the content does, so they can be
    # cached indefinitely; index.html must not be.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
