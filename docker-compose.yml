# Ukweli production stack: Postgres, the API, the web bundle, and Caddy in
# front doing TLS. Start with: docker compose up -d --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ukweli}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ukweli}
    volumes:
      - ukweli-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ukweli} -d ${POSTGRES_DB:-ukweli}']
      interval: 10s
      timeout: 5s
      retries: 10
    # Not published to the host: only the API needs to reach it.
    expose:
      - '5432'

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ukweli}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ukweli}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RATE_LIMIT_ANALYZE_PER_MIN: ${RATE_LIMIT_ANALYZE_PER_MIN:-10}
      PORT: '8787'
    expose:
      - '8787'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:8787/healthz || exit 1']
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    expose:
      - '80'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - api
      - web
    ports:
      - '80:80'
      - '443:443'
    environment:
      # A bare hostname makes Caddy obtain a certificate automatically.
      # Use localhost for a local run — it issues a local certificate instead.
      UKWELI_DOMAIN: ${UKWELI_DOMAIN:-localhost}
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ukweli-caddy-data:/data
      - ukweli-caddy-config:/config

volumes:
  ukweli-pgdata:
  ukweli-caddy-data:
  ukweli-caddy-config:
